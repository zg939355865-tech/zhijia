<!doctype html><html lang="zh-CN" data-theme="light" data-scene="water-operations"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业管理 · 污水厂生产智驾运管平台</title><link rel="stylesheet" href="../../assets/components/tokens.css"><style>
[hidden]{display:none!important}body{margin:0}.org-page{max-width:1600px;margin:auto;padding:28px 32px}.org-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.org-head h1{font-size:24px;margin:0 0 6px}.org-head p{color:var(--gray);margin:0}.org-draft{padding:12px 16px;border:1px solid var(--tag-line);background:var(--info-bg);border-radius:4px;color:var(--teal);font-size:13px;margin-bottom:22px}.org-search{display:flex;align-items:end;gap:14px;flex-wrap:wrap}.org-search label{display:grid;gap:8px;min-width:200px}.org-search input{width:260px}.org-toolbar:has(#create){justify-content:flex-end}.org-toolbar,.org-bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0}.org-toolbar h2{font-size:16px;margin:0}.org-bottom{margin-bottom:0;color:var(--gray);font-size:13px}.org-pager{display:flex;gap:8px;align-items:center}.org-muted{color:var(--gray)}.org-form{max-width:1080px}.org-form h2,.org-detail h2{font-size:16px;margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}.org-form .vc-form-grid{gap:20px 28px}.org-field{display:grid;gap:8px}.org-wide{grid-column:1/-1}.org-actions{display:flex;gap:12px;border-top:1px solid var(--line-soft);margin-top:26px;padding-top:22px}.org-msg{color:var(--err);min-height:22px;margin-top:12px}.org-toast{margin-bottom:12px;color:var(--teal)}.org-details{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}.org-kv{display:grid;grid-template-columns:110px minmax(0,1fr);padding:15px 0;border-bottom:1px solid var(--line-soft);gap:16px}.org-kv dt{color:var(--gray)}.org-kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.org-empty{text-align:center;padding:48px!important;color:var(--gray)!important}.org-note{font-size:12px;color:var(--gray);margin:20px 0}.org-dialog{width:430px;max-width:90vw;border:1px solid var(--line);background:var(--panel-bg);color:var(--ink);border-radius:6px;padding:26px;box-shadow:var(--sh-pop)}.org-dialog::bac .org-toolbar:has(#create){justify-content:flex-end}.org-search{margin-bottom:20px}</style><link rel="stylesheet" href="../../assets/components/components.css"></head><body class="vc-page"><main class="org-page" data-component-baseline="veridix-component-baseline-v1"><header class="org-head"><div><h1>企业管理</h1></div><div class="org-head-actions"><button class="vc-btn" id="batch-delete" disabled>批量删除</button><button class="vc-btn vc-btn--primary" id="create">＋ 新增企业</button></div><div class="org-form-actions" hidden><button type="button" class="vc-btn" id="cancel">返回列表</button><button type="submit" form="form" class="vc-btn vc-btn--primary" id="save">保存</button></div><div class="org-detail-actions" hidden><button class="vc-btn" id="detail-back">返回列表</button></div></header><div id="toast" class="org-toast" role="status" aria-live="polite"></div><section id="list-view" class="org-list-layout"><div class="vc-section org-query-panel"><div class="org-search"><label for="keyword">企业编码 / 名称<input class="vc-input" id="keyword" placeholder="请输入编码或名称"></label><button class="vc-btn vc-btn--primary" id="query">查询</button><button class="vc-btn" id="reset">重置</button></div></div><div class="vc-section org-results-panel"><div class="vc-table__wrap"><table class="vc-table" id="table"><thead id="thead"></thead><tbody id="rows"></tbody></table></div><div class="org-bottom"><span id="count"></span><nav class="org-pager" id="pager" aria-label="分页"></nav></div></div></section><section id="form-view" class="vc-section org-form" hidden><div class="vc-tabs org-form-tabs"><span class="vc-tabs__item vc-tabs__item--active">基础信息</span><span id="form-title" hidden></span></div><form id="form"><div class="vc-form-grid" id="fields"></div><div class="org-msg" id="form-error" role="alert"></div></form></section><section id="detail-view" class="vc-section org-detail" hidden><div class="vc-tabs org-detail-tabs" role="tablist" aria-label="详情分区"><button type="button" class="vc-tabs__item vc-tabs__item--act
